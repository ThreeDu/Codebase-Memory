name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # path handling, file locking and fs.watch differ per OS; 20 is the oldest Node package.json allows
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
